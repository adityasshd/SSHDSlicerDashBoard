name: Settlement snapshot regression tests

on:
  push:
    branches:
      - feat/settlement-snapshot-foundation
  pull_request:

permissions:
  contents: read

jobs:
  test-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install project requirements
        run: python -m pip install -r requirements.txt pytest
      - name: Compile changed modules
        run: python -m compileall -q src/slicing_dashboard/reporting/settlement_snapshots.py src/slicing_dashboard/pages/dashboard_panels.py src/slicing_dashboard/pages/dashboard_trend.py src/slicing_dashboard/app.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_report_crosschecks.py tests/test_rework_reconciliation.py tests/test_rework_hours.py tests/test_settlement_snapshots.py tests/test_settlement_snapshot_callbacks.py tests/test_saved_panel_fallback.py tests/test_dashboard_panels.py tests/test_dashboard_trend_refresh.py
