name: Saved viewer panel regression tests

on:
  push:
    branches:
      - fix/viewer-stale-saved-panels
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile modified modules
        run: python -m compileall -q src/slicing_dashboard/reporting/dashboard_panels.py src/slicing_dashboard/pages/dashboard_panels.py
      - name: Test viewer fallback and existing dashboards
        run: python -m pytest -q tests/test_saved_panel_fallback.py tests/test_dashboard_panels.py
